name: Quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  media:
    name: Self-hosted call media and recording acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable media services
        run: |
          mkdir -p .data/call-recordings
          chmod 700 .data/call-recordings
          docker compose -f compose.calls.yaml up -d --wait --wait-timeout 120
      - run: npm run build -w @ao/web
      - name: Exchange real tracks and create a consented private recording
        run: npx playwright test tests/e2e/calls-delivery.spec.ts
        env:
          CI: '1'
          PLAYWRIGHT_PORT: '3100'
          LIVEKIT_TEST_URL: ws://localhost:7880
          LIVEKIT_TEST_KEY: orbit-local
          LIVEKIT_TEST_SECRET: local-development-only-do-not-use-in-production-32
          LIVEKIT_RECORDING_TEST: 'true'
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-browser-failures
          path: test-results/
          retention-days: 7
      - name: Stop disposable media services
        if: always()
        run: docker compose -f compose.calls.yaml down
  check:
    name: Build and embedded database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:unused
      - run: npm run typecheck
      - run: npm run ops:test
      - name: Check generated public API compatibility
        run: npm run api:check
      - name: Test Python SDK
        run: npm run test:sdk:python
      - name: Embedded PostgreSQL tests
        run: npm run test -w @ao/api -- --no-file-parallelism
      - run: npm run build
      - name: Compile managed runtime without inference
        run: npm run runtime:build
        env:
          AGENT_MODEL: fixture/compile-only

  postgres:
    name: PostgreSQL 17 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: orbit_ci_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Test migrations, RLS, pooling and concurrent writes
        run: npm run test -w @ao/api -- --no-file-parallelism
        env:
          TEST_DATABASE_URL: postgres://postgres:orbit_ci_test@127.0.0.1:5432/postgres

      - name: Evaluate retrieval relevance and PostgreSQL latency on an isolated synthetic corpus
        run: node --import tsx scripts/retrieval-evaluate.ts > retrieval-evaluation-postgres.json
        env:
          TEST_DATABASE_URL: postgres://postgres:orbit_ci_test@127.0.0.1:5432/postgres
          RETRIEVAL_EVALUATION_DOCUMENTS: 5000
          RETRIEVAL_EVALUATION_CONCURRENCY: 4
      - name: Preserve retrieval baseline
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-evaluation-postgres
          path: retrieval-evaluation-postgres.json
          retention-days: 7

  browser:
    name: Chromium end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Install Chromium and operating system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test production web application with isolated API fixtures
        run: npm run test:e2e
      - name: Preserve browser reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  native-source:
    name: Native client policy and bundle checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run build -w @ao/desktop
      - run: npm run test -w @ao/desktop
      - run: npm run build -w @ao/mobile
      - name: Compile mobile JavaScript for both platforms without signing or publishing
        run: npm exec -w @ao/mobile -- expo export --platform ios --platform android --output-dir ../../.data/mobile-export
