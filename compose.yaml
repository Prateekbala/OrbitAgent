services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orchestration
      POSTGRES_USER: orchestration_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orchestration_dev -d orchestration']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
