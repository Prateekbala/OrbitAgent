name: orbit-local-services
services:
  clamav:
    image: clamav/clamav:1.4.6-debian
    restart: unless-stopped
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 3g
    cpus: 2
    security_opt:
      - no-new-privileges:true
  ollama:
    image: ollama/ollama:0.34.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:11435:11434'
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
      - ./infra/ollama:/config:ro
    mem_limit: 4g
    cpus: 4
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  clamav_data:
  ollama_data:
